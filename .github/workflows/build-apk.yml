name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Detect project directory
        id: find_dir
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "dir=." >> $GITHUB_OUTPUT
          elif [ -f "GymFit/pubspec.yaml" ]; then
            echo "dir=GymFit" >> $GITHUB_OUTPUT
          else
            FOUND=$(find . -maxdepth 3 -name pubspec.yaml -not -path "*/.*" | head -n 1)
            if [ -n "$FOUND" ]; then
              echo "dir=$(dirname $FOUND)" >> $GITHUB_OUTPUT
            else
              echo "dir=." >> $GITHUB_OUTPUT
            fi
          fi

      - name: Install dependencies
        working-directory: ${{ steps.find_dir.outputs.dir }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ steps.find_dir.outputs.dir }}
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GymFit-APK
          path: ${{ steps.find_dir.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
